name: Verify fix

# Builds the standalone executable to prove voidzero-dev/vite-plus#1586 is fixed:
# with the pkg.pr.new core, `vp pack` no longer fails with
# `Failed to import module "@tsdown/exe"` and needs no @tsdown/exe patch.

on:
  push:
  pull_request:

jobs:
  build-executable:
    name: Build standalone executable (vp pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build (vp pack)
        run: yarn build

      - name: Show produced executable
        run: |
          ls -la build/
          file build/* || true
